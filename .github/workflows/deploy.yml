name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 1:00 = 北京时间每天 9:00，覆盖 arXiv 当日 announce 与 HN 前 24 小时热点
    - cron: '0 1 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建期抓取前沿内容并写入每日归档 src/data/digests/。
      # 脚本内部容错：单源失败只告警，全部失败时不写归档，构建不会失败。
      - name: Fetch tech feeds
        run: node scripts/fetch-feeds.mjs

      # 把每日归档回写仓库，实现"每天的消息"持久沉淀（[skip ci] 防止循环触发）。
      - name: Persist digest archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore(feeds): update digest archive [skip ci]"
            git push || echo "::warning::digest push failed, archive stays local for this build"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
